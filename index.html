<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tổng hợp Báo cáo Dân số</title>
<meta name="description" content="Tổng hợp báo cáo dân số – Trạm Y tế xã Lệ Thuỷ">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script>/* ===== Bản chạy độc lập (GitHub Pages): lưu dữ liệu trong trình duyệt, tải tệp trực tiếp, Claude qua khóa API ===== */
window.__STANDALONE = true;
(function(){
  const IDB = (() => {
    let dbp;
    const open = () => dbp || (dbp = new Promise((res, rej) => { const r = indexedDB.open("tong-hop-dan-so", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }));
    const tx = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => { const t = db.transaction("kv", mode); let out; fn(t.objectStore("kv"), v => { out = v; }); t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }); };
    return {
      get: k => tx("readonly", (st, set) => { const r = st.get(k); r.onsuccess = () => set(r.result); }),
      set: (k, v) => tx("readwrite", st => { st.put(v, k); }),
      del: k => tx("readwrite", st => { st.delete(k); }),
      all: () => tx("readonly", (st, set) => { const out = {}; const r = st.openCursor(); r.onsuccess = () => { const c = r.result; if (c) { out[c.key] = c.value; c.continue(); } else set(out); }; }),
      putAll: obj => tx("readwrite", st => { for (const [k, v] of Object.entries(obj)) st.put(v, k); })
    };
  })();
  window.__IDB = IDB;
  const cp = v => v == null ? v : JSON.parse(JSON.stringify(v));
  const snap = (id, v) => ({ id, exists: v != null, data: () => v == null ? undefined : cp(v), metadata:{ fromCache:false, hasPendingWrites:false } });
  function mkDoc(path){
    const id = path.split("/").pop();
    return { path, id,
      get: async () => snap(id, await IDB.get(path)),
      set: async d => { await IDB.set(path, cp(d)); },
      update: async d => { const v = (await IDB.get(path)) || {}; await IDB.set(path, Object.assign(v, cp(d))); },
      delete: async () => { await IDB.del(path); },
      collection: sub => mkColl(path + "/" + sub) };
  }
  function mkColl(path, filters = []){
    return { path,
      doc: id => mkDoc(path + "/" + (id || (Date.now().toString(36) + Math.random().toString(36).slice(2, 8)))),
      where: (f, op, v) => mkColl(path, [...filters, [f, op, v]]),
      orderBy: () => mkColl(path, filters), limit: () => mkColl(path, filters),
      get: async () => {
        const all = await IDB.all(), pre = path + "/";
        const docs = Object.entries(all).filter(([k]) => k.startsWith(pre) && !k.slice(pre.length).includes("/"))
          .filter(([, v]) => filters.every(([f, op, val]) => op === "==" ? v && v[f] === val : true)).map(([k, v]) => snap(k.slice(pre.length), v));
        return { docs, size: docs.length, empty: !docs.length, docChanges: () => [] };
      },
      add: async d => { const r = mkColl(path).doc(); await r.set(d); return r; } };
  }
  const db = { doc: mkDoc, collection: p => mkColl(p) };

  const downloads = { save: async ({ filename, data }) => {
    const blob = data instanceof Blob ? data : new Blob([data]);
    const url = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    return { status:"saved" };
  } };

  const getKey = () => { try { return localStorage.getItem("ths_api_key") || ""; } catch(e){ return ""; } };
  const getModel = tier => { try { return (tier === "complex" ? localStorage.getItem("ths_model_complex") : localStorage.getItem("ths_model")) || (tier === "complex" ? "claude-opus-5-5" : "claude-sonnet-5-5"); } catch(e){ return "claude-sonnet-5-5"; } };
  async function imgPart(blob){
    let bmp; try { bmp = await createImageBitmap(blob); } catch(e){ throw { code:"image_rejected", message:"Không mở được ảnh" }; }
    const k = Math.min(1, 1568 / Math.max(bmp.width, bmp.height)), c = document.createElement("canvas");
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k); c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const data = c.toDataURL("image/jpeg", 0.9).split(",")[1];
    return { type:"image", source:{ type:"base64", media_type:"image/jpeg", data } };
  }
  async function sample(input, opts = {}){
    const key = getKey(); if (!key) throw { code:"not_granted", message:"Chưa nhập khóa API" };
    const msgs = typeof input === "string" ? [{ role:"user", content:input }] : input.map(m => ({ role:m.role, content:m.content }));
    const imgs = opts.images ? (opts.images instanceof Blob ? [opts.images] : Array.from(opts.images)) : [];
    if (imgs.length) { const last = msgs[msgs.length - 1]; last.content = [...(await Promise.all(imgs.map(imgPart))), { type:"text", text: last.content }]; }
    let res;
    try {
      res = await fetch("https://api.anthropic.com/v1/messages", { method:"POST", signal: opts.signal,
        headers:{ "content-type":"application/json", "x-api-key": key, "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true" },
        body: JSON.stringify({ model: getModel(opts.modelTier), max_tokens: 16000, messages: msgs }) });
    } catch(e){ if (e && e.name === "AbortError") throw { code:"cancelled", message:"Đã dừng" }; throw { code:"upstream_error", message:"Không kết nối được tới Claude: " + (e && e.message || e) }; }
    if (!res.ok) { const t = await res.text().catch(() => ""); throw { code: res.status === 429 || res.status === 529 ? "rate_limited" : res.status === 401 || res.status === 403 ? "not_granted" : res.status === 400 ? "invalid_request" : "upstream_error", message:`Lỗi API ${res.status}: ${t.slice(0, 300)}` }; }
    const j = await res.json(); const text = (j.content || []).filter(c => c.type === "text").map(c => c.text).join("");
    if (!text.trim()) throw { code:"empty_completion", message:"Claude không trả lời" };
    if (opts.onText) try { opts.onText({ text, delta:text }); } catch(e){}
    return { text, truncated: j.stop_reason === "max_tokens", modelTierApplied: opts.modelTier || "default" };
  }
  sample.json = async (input, opts) => {
    const r = await sample(input, opts), t = r.text.trim();
    const tries = [t, (/```(?:json)?\s*([\s\S]*?)```/.exec(t) || [])[1], (() => { const a = t.search(/[\[{]/), b = Math.max(t.lastIndexOf("}"), t.lastIndexOf("]")); return a >= 0 && b > a ? t.slice(a, b + 1) : null; })()];
    for (const x of tries) if (x) try { return JSON.parse(x); } catch(e){}
    throw { code:"invalid_json", message:"Kết quả không đúng dạng JSON", text:r.text };
  };
  sample.limits = async () => ({ maxPromptBytes: 262144, images:{ maxCount:5, maxInputBytes:20e6, mediaTypes:["image/jpeg","image/png","image/webp","image/gif"] }, tools:{ maxCount:0 } });
  const user = { isOwner: async () => true, canEdit: async () => true, can: async () => true, id: async () => "local", me: async () => ({ id:"local", name:"" }) };
  window.claude = { use: async name => name === "db" ? db : name === "downloads" ? downloads : name === "user" ? user : name === "sample" ? (getKey() ? sample : null) : null };
})();
</script>

<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Tinos:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<style>
/* Layout: bàn làm việc của cán bộ tổng hợp — thanh điều hướng bên trái, vùng làm việc bên phải; trang văn bản xem trước giữ màu giấy thật */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#f6f8fa; --ink:#15212b; --muted:#5a6a77; --line:#d5dce2;
  --accent:#1c5878; --accent-ink:#ffffff; --accent-soft:#e1edf3; --calc:#eef2f5; --sum:#f2f7ea; --auto:#eef0fb; --auto-ink:#3d4a9c;
  --ok:#2d7a4c; --warn:#9a6110; --warn-soft:#fdf3e1; --danger:#a5322c; --danger-soft:#f8e7e5;
  --paper:#ffffff; --paper-ink:#111111; --shadow:0 1px 2px rgba(20,35,45,.06),0 4px 16px rgba(20,35,45,.06);
  --f-ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-doc:"Tinos","Times New Roman",Times,serif;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e151b; --surface:#151f28; --surface-2:#1a2631; --ink:#e2e9ef; --muted:#93a3b0; --line:#2a3743;
  --accent:#72b4d8; --accent-ink:#08151d; --accent-soft:#1a3242; --calc:#1b2732; --sum:#1d2a1f; --auto:#1e2240; --auto-ink:#a9b3f2;
  --ok:#6cc391; --warn:#e2aa55; --warn-soft:#33281a; --danger:#e57d72; --danger-soft:#3a1f1d;
  --paper:#fbfbf8; --paper-ink:#111111; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e151b; --surface:#151f28; --surface-2:#1a2631; --ink:#e2e9ef; --muted:#93a3b0; --line:#2a3743;
  --accent:#72b4d8; --accent-ink:#08151d; --accent-soft:#1a3242; --calc:#1b2732; --sum:#1d2a1f; --auto:#1e2240; --auto-ink:#a9b3f2;
  --ok:#6cc391; --warn:#e2aa55; --warn-soft:#33281a; --danger:#e57d72; --danger-soft:#3a1f1d;
  --paper:#fbfbf8; --paper-ink:#111111; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh;height:100dvh}
.brand{display:flex;gap:10px;align-items:center}
.seal{width:36px;height:36px;border-radius:50%;border:2px solid var(--accent);display:grid;place-items:center;color:var(--accent);font-weight:700;font-size:12px;letter-spacing:.02em;flex:none}
.brand b{display:block;font-size:15px;line-height:1.2}
.brand small{color:var(--muted);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:6px;color:var(--muted);font-weight:500;display:flex;justify-content:space-between;align-items:center}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav button:focus-visible{outline:2px solid var(--accent)}
.nav .count{font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted)}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:1px}
.dot.off{background:var(--warn)}
main{min-width:0;padding-block:24px 64px;padding-left:28px;padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font-size:22px;line-height:1.25;margin:0;text-wrap:balance;font-weight:700}
h2{font-size:16px;margin:0;font-weight:600}
h3{font-size:14px;margin:0;font-weight:600}
.eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--danger)}
.btn.danger:hover{border-color:var(--danger);background:var(--danger-soft)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.5;pointer-events:none}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.lbl{font-size:12.5px;color:var(--muted);font-weight:500}
.inp,select.inp,textarea.inp{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);min-width:0}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{resize:vertical;line-height:1.55}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.grid6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:10px 14px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tabs button:focus-visible{outline:2px solid var(--accent)}
.tabs.sm button{padding:7px 10px;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:12px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.acc{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600}
.chip.ok{color:var(--ok)}
.chip.warn{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.chip.auto{color:var(--auto-ink);background:var(--auto);border-color:transparent}
.notice{border:1px solid var(--line);border-left:3px solid var(--warn);background:var(--surface);padding:10px 14px;border-radius:6px;font-size:13px}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:14px 16px;border-top:1px solid var(--line);align-items:center;cursor:pointer}
.item:first-child{border-top:0}
.item:hover{background:var(--surface-2)}
.item .t{font-weight:600}
.meter{height:5px;width:120px;background:var(--surface-2);border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--accent)}
.empty{padding:36px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty b{color:var(--ink);font-size:15px}
/* Bảng số liệu */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.g{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
table.g th,table.g td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;vertical-align:middle}
table.g th:last-child,table.g td:last-child{border-right:0}
table.g thead th{background:var(--surface-2);font-size:12.5px;font-weight:600;padding:8px;text-align:center;position:sticky;top:0;z-index:1}
table.g thead tr.idx th{font-weight:400;color:var(--muted);font-size:11.5px;padding:3px 8px}
table.g td.stt{text-align:center;color:var(--muted);padding:6px;width:44px;font-size:13px}
table.g td.nm{padding:6px 10px;min-width:240px}
table.g td.un{padding:6px;text-align:center;color:var(--muted);font-size:12.5px;width:74px}
table.g tr.b td.nm,table.g tr.b td.stt{font-weight:600;color:var(--ink)}
table.g tr.hd td{background:var(--surface-2)}
table.g td.v{min-width:112px}
table.g td.v input,table.g td.gc input{all:unset;box-sizing:border-box;width:100%;padding:7px 10px;text-align:right;display:block}
table.g td.gc{min-width:140px}
table.g td.gc input{text-align:left;font-size:13px}
table.g td.v input:focus,table.g td.gc input:focus{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
table.g td.v.sum input{background:var(--sum)}
table.g td.v.auto input{background:var(--auto);color:var(--auto-ink);font-weight:600}
table.g td.v.f{background:var(--calc);text-align:right;padding:7px 10px;color:var(--muted);font-weight:500}
table.g td.v.hl{animation:hl 1.6s ease-out}
@keyframes hl{from{box-shadow:inset 0 0 0 2px var(--ok)}to{box-shadow:inset 0 0 0 2px transparent}}
@media (prefers-reduced-motion:reduce){table.g td.v.hl{animation:none}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:10px;border:1px solid var(--line);border-radius:2px;display:inline-block}
.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:18px;text-align:center;cursor:pointer;background:var(--surface-2);display:flex;flex-direction:column;gap:6px;align-items:center}
.drop.over,.drop:hover{border-color:var(--accent);background:var(--accent-soft)}
.drop b{font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex-wrap:wrap}
.seg label{padding:6px 10px;cursor:pointer;font-size:13px;display:flex;gap:6px;align-items:center}
.seg input{accent-color:var(--accent)}
.seg label:has(input:checked){background:var(--accent-soft);color:var(--accent);font-weight:600}
.job{border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.job .nm{font-weight:600;word-break:break-word}
.status{font-size:12.5px;color:var(--muted)}
.status.err{color:var(--danger)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
table.rv{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
table.rv td,table.rv th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.rv th{font-size:12px;color:var(--muted);font-weight:600;background:var(--surface-2);white-space:nowrap}
table.rv td.n,table.rv th.n{text-align:right;white-space:nowrap}
table.rv td:first-child{white-space:nowrap}
table.rv td.nw{white-space:nowrap}
table.rv tr.sub td{font-weight:600;background:var(--accent-soft)}
table.rv tr.tot td{font-weight:700;background:var(--surface-2)}
table.rv input.inp{padding:4px 6px;text-align:right;width:96px}
table.rv .src{color:var(--muted);font-size:12px;font-style:italic}
table.rv tr.dup td{background:var(--warn-soft)}
/* Bảng sửa phiếu */
table.pe{border-collapse:collapse;font-size:13px}
table.pe th{font-size:11.5px;color:var(--muted);font-weight:600;background:var(--surface-2);padding:5px 6px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1}
table.pe td{border-bottom:1px solid var(--line);padding:2px}
table.pe td input,table.pe td select{border:1px solid transparent;border-radius:4px;padding:5px 6px;background:transparent;width:100%;min-width:72px}
table.pe td input:focus,table.pe td select:focus{border-color:var(--accent);background:var(--surface);outline:none}
table.pe td input.bad,table.pe td select.bad{border-color:var(--warn);background:var(--warn-soft)}
table.pe tr.nghi td{background:var(--warn-soft)}
table.pe .w-l{min-width:170px}.pe .w-m{min-width:110px}.pe .w-s{min-width:64px;width:64px}

"use strict";
/* ===================== Tiện ích ===================== */
const $ = (s, el=document) => el.querySelector(s);

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const noDia = s => String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D").toLowerCase().replace(/\s+/g," ").trim();
function fmtNum(v, dec){
  if (v == null || v === "" || isNaN(v)) return "";
  if (dec == null) { return Number(v).toLocaleString("vi-VN", {maximumFractionDigits:3}); }
  return Number(v).toLocaleString("vi-VN", {minimumFractionDigits:dec, maximumFractionDigits:dec});
}
function parseNum(s){
  if (typeof s === "number") return isFinite(s) ? s : null;
  if (s == null) return null;
  s = String(s).trim().replace(/[\s\u00a0]/g,"").replace(/%$/,"");
  if (!s || s === "-" ) return null;
  let neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1,-1); }
  if (s.includes(".") && s.includes(",")) s = s.replace(/\./g,"").replace(",",".");
  else if (s.includes(",")) { const parts = s.split(","); s = parts.length===2 ? parts[0]+"."+parts[1] : s.replace(/,/g,""); }
  else if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,"");

  return isFinite(v) ? (neg ? -v : v) : null;
}

const libLoading = {};
function loadLib(name){
  if (window[name]) return Promise.resolve(window[name]);
  if (libLoading[name]) return libLoading[name];

    for (const url of LIBS[name]) {
      try {
        await new Promise((ok, bad) => { const s = document.createElement("script"); s.src = url; s.onload = ok; s.onerror = bad; document.head.appendChild(s); });
        if (window[name]) return window[name];
      } catch(e) {}

    libLoading[name] = null;
    throw new Error("Không tải được thư viện " + name + ". Kiểm tra kết nối mạng rồi thử lại.");

function readDocBinary(buf){

    const secs = chain(start, fat), out = new Uint8Array(secs.length * secSize);
    secs.forEach((s, i) => out.set(u8.subarray(secOff(s), secOff(s) + secSize), i * secSize));
    return size != null ? out.subarray(0, size) : out;
  };
  const dir = readChain(dirStart), ddv = new DataView(dir.buffer, dir.byteOffset, dir.byteLength), entries = [];
  for (let o = 0; o + 128 <= dir.length; o += 128) {

    entries.push({ name, type: dir[o + 66], start: ddv.getUint32(o + 116, true), size: ddv.getUint32(o + 120, true) });

            const sprm = bdv.getUint16(g, true), spra = sprm >> 13; g += 2;
            if ((sprm === 0x2417 || sprm === 0x244C) && bytes[g] === 1) return 2;

        };

    }
  } catch(e) {}

  const isRowEnd = fc => { let lo = 0, hi = ttp.length - 1; while (lo <= hi) { const m = (lo+hi) >> 1; if (fc < ttp[m][0]) hi = m-1; else if (fc >= ttp[m][1]) lo = m+1; else return ttp[m][2]; } return 0; };

function expandSum(expr, ids){
  return String(expr||"").replace(/SUM\(\s*([rc]\d+)\s*:\s*([rc]\d+)\s*\)/gi, (m,a,b) => {
    const i = ids.indexOf(a.toLowerCase()), j = ids.indexOf(b.toLowerCase());
    if (i < 0 || j < 0) return "0";
    const [s,e] = i <= j ? [i,j] : [j,i];

}

}

function compute(tpl, rep, auto){
  const V = {}, M = {};
  auto = auto || repAuto(rep);
  const ac = autoColId(tpl);
  const rowIds = tpl.rows.map(r => r.id), colIds = tpl.cols.map(c => c.id);
  const base = rep.base || {}, parts = rep.parts || [];
  for (const r of tpl.rows) for (const c of tpl.cols) {
    if (!isInputCell(r,c)) continue;
    const k = r.id + "|" + c.id;
    if (base[k] != null) { V[k] = base[k]; M[k] = "base"; continue; }
    if (r.auto && c.id === ac && auto.m && auto.m[r.auto] != null) { V[k] = auto.m[r.auto]; M[k] = "auto"; continue; }
    let sum = null, n = 0;
    for (const p of parts) if (p.values && p.values[k] != null) { sum = (sum||0) + p.values[k]; n++; }
    if (sum != null) { V[k] = sum; M[k] = "sum:" + n; }
  }

    for (const r of tpl.rows) if (r.formula && !r.head) {
      const ex = expandSum(r.formula, rowIds);
      for (const c of tpl.cols) if (!c.formula) { const k = r.id+"|"+c.id; V[k] = evalExpr(ex, id => V[id+"|"+c.id]); M[k] = "f"; }
    }

    const ex = expandSum(c.formula, colIds);
    for (const r of tpl.rows) if (!r.head) { const k = r.id+"|"+c.id; V[k] = evalExpr(ex, id => V[r.id+"|"+id]); M[k] = "f"; }

}

}

async function savePhieu(){

  if (!d.thon) { toast("Cần ghi tên thôn của phiếu.", true); $("#pe-thon").focus(); return; }
  if (diaBans().some(x => x.ten) && !d.diaBan) { toast("Cần chọn địa bàn của phiếu.", true); $("#pe-db")?.focus(); return; }
  const left = SECTIONS.reduce((a,s) => a + d.sections[s.k].filter(r => r.nghi).length, 0);
  await store.loadYear(d.nam);
  const same = S.phieu.find(p => p.id !== d.id && p.nam === d.nam && p.thang === d.thang && noDia(p.thon) === noDia(d.thon) && noDia(dbOf(p)) === noDia(dbOf(d)));
  if (same) {
    const c = await choiceBox(`Thôn "${d.thon}"${d.diaBan ? " (" + d.diaBan + ")" : ""} đã có phiếu tháng ${mLabel(d.thang)}/${d.nam}. Phiếu mới này là phần bổ sung (ví dụ tờ 2) hay thay thế phiếu cũ?`, [["merge","Gộp thêm vào phiếu cũ",true],["replace","Thay thế phiếu cũ"]]);
    if (!c) return;
    if (c === "merge") {
      for (const s of SECTIONS) same.sections[s.k] = [...(same.sections[s.k]||[]), ...d.sections[s.k]];
      if (same.T == null) same.T = d.T; if (same.N == null) same.N = d.N; if (!same.ctv) same.ctv = d.ctv;
      same.files = [...(same.files||[]), ...(d.files||[])]; same.updatedAt = Date.now();
      await store.put("phieu", same);

    }

}

/* ---------- Nhận dạng tệp số liệu đã báo cáo (Biểu 01-DSX, chỉ tiêu giao) ---------- */
const B01_KEYS = ["sinh_tong","sinh_nam","sinh_nu","sinh_con2","sinh_con3","sinh_me20","mangthai_dang","vong_moi","vong_thay","vong_thoi","tsnam","tsnu","cay_moi","cay_thay","cay_thoi"];
const STOCK_KEYS = new Set(["mangthai_dang"]);
function metricOfName(name){
  const n = noDia(name);
  if (/^trong (tong so|do tong so)\s*:?$/.test(n) || n === "trong tong so" ) return null;
  const rules = [["tong so tre sinh","sinh_tong"],["tre nam sinh","sinh_nam"],["tre em nam sinh","sinh_nam"],["tre nu sinh","sinh_nu"],["tre em nu sinh","sinh_nu"],
    ["con thu 2","sinh_con2"],["con thu 3","sinh_con3"],["phu nu duoi 20","sinh_me20"],["dang mang thai","mangthai_dang"],["mang thai trong","mangthai"],
    ["thay vong","vong_thay"],["thoi su dung vong","vong_thoi"],["dat vong tranh thai moi","vong_moi"],["nam moi triet san","tsnam"],["nu moi triet san","tsnu"],
    ["thay que cay","cay_thay"],["thoi su dung que cay","cay_thoi"],["thoi su dung cay","cay_thoi"],["cay thuoc tranh thai moi","cay_moi"],["moi cay thuoc","cay_moi"],
    ["nguoi chet","chet"],["tao ton","taohon"],["tao hon","taohon"],["so nguoi ket hon trong","kethon"],["tong so nguoi ket hon","kethon"],["chuyen den tu xa khac","den"],["chuyen di khoi xa","di"]];
  for (const [k, v] of rules) if (n.includes(k)) return v;
  return null;
}
const cellStr = v => v == null ? "" : String(v).replace(/\s+/g, " ").trim();
const cellNum = v => { if (v == null || v === "") return null; if (typeof v === "number") return v; const t = String(v).trim(); if (!t) return null; return parseNum(t); };
function parseBieu01Rows(rows){
  const flat = rows.map(r => (r || []).map(cellStr));
  if (!flat.slice(0, 3).some(r => r.some(c => /01-DSX/i.test(c)))) return null;
  let kind = null, nam = null, from = null, to = null;
  for (const r of flat.slice(0, 12)) for (const c of r) {
    const u = noDia(c);
    let m = /tu thang\s*0?(\d{1,2})\s*den thang\s*0?(\d{1,2})\s*nam\s*(\d{4})/.exec(u);
    if (m && !kind) { kind = "luyke"; from = +m[1]; to = +m[2]; nam = +m[3]; }
    m = /^\s*thang\s*0?(\d{1,2})\s*nam\s*(\d{4})/.exec(u);
    if (m && !kind) { kind = "thang"; from = to = +m[1]; nam = +m[2]; }
  }
  if (!kind) return null;
  const hi = flat.findIndex(r => noDia(r[0]).startsWith("ten chi tieu"));
  if (hi < 0) return null;
  const head = flat[hi], sub = flat[hi+1] || [];
  // cột: D = Toàn xã; các cột có tên địa bàn; cột trống tiêu đề nhưng có tiêu đề phụ thuộc về địa bàn liền trước
  const colDb = {}; let last = null, txCol = -1;
  for (let j = 3; j < Math.max(head.length, sub.length); j++) {
    const h = head[j] || "";
    if (/toan xa/.test(noDia(h))) { txCol = j; last = null; continue; }
    if (/ghi chu/.test(noDia(h))) { last = null; continue; }
    if (h) { last = matchDiaBan(h) || h; colDb[j] = last; }
    else if (last && sub[j]) colDb[j] = last;
  }
  if (txCol < 0) txCol = 3;
  const toanXa = {}, perDb = {}, seen = new Set();
  for (let i = hi + 1; i < rows.length; i++) {
    const key = metricOfName(flat[i][1] || ""); if (!key || seen.has(key)) continue; seen.add(key);
    const r = rows[i] || [];
    const tv = cellNum(r[txCol]); if (tv != null) toanXa[key] = tv;
    for (const [j, db] of Object.entries(colDb)) { const v = cellNum(r[+j]); perDb[db] = perDb[db] || {}; perDb[db][key] = (perDb[db][key] || 0) + (v || 0); }
  }
  if (!Object.keys(toanXa).length) return null;
  const sig = flat.slice(hi).map(r => r.filter(Boolean)).flat();
  const unit = (flat.slice(0, 4).flat().find(c => /don vi bao cao/.test(noDia(c))) || "").replace(/^.*?:\s*/, "");
  return { loai: kind === "luyke" ? "b01_luyke" : "b01_thang", nam, from, to, toanXa, perDb: Object.keys(perDb).length ? perDb : null, donVi: unit };
}
function parseChiTieuRows(rows){
  const flat = rows.map(r => (r || []).map(cellStr));
  if (!flat.slice(0, 8).some(r => r.some(c => /chi tieu/.test(noDia(c))))) return null;
  const hi = flat.findIndex(r => r.some(c => /^don vi$/.test(noDia(c))));
  if (hi < 0) return null;
  const nameCol = flat[hi].findIndex(c => /^don vi$/.test(noDia(c)));
  let y = null; for (const r of flat.slice(0, 8)) for (const c of r) { const m = /nam\s*(\d{4})/.exec(noDia(c)); if (m) y = +m[1]; }
  const cols = [];
  for (let j = nameCol + 1; j < Math.max(flat[hi].length, (flat[hi+1]||[]).length); j++) {
    const nm = flat[hi+1] && flat[hi+1][j] ? flat[hi+1][j] : flat[hi][j];
    if (!nm || /ghi chu/.test(noDia(nm))) continue;
    cols.push({ j, name: nm, key: "c" + j });
  }
  const out = { loai:"chitieu", nam:y, cols: cols.map(c => ({ key:c.key, name:c.name })), toanXa:{}, rows:[] };
  for (let i = hi + 2; i < rows.length; i++) {
    const nm = flat[i][nameCol]; if (!nm || nm.length <= 1) continue;
    const vals = {}; let any = false;
    for (const c of cols) { const raw = rows[i][c.j]; const v = typeof raw === "number" ? raw : cellStr(raw); if (v !== "" && v != null) { vals[c.key] = v; any = true; } }
    if (!any) continue;
    if (/toan xa/.test(noDia(nm))) out.toanXa = vals; else out.rows.push({ thon: nm, vals });
  }
  return out.rows.length ? out : null;
}

const B01_NAMES = { sinh_tong:"Tổng số trẻ sinh", sinh_nam:"– Trẻ nam", sinh_nu:"– Trẻ nữ", sinh_con2:"– Con thứ 2", sinh_con3:"– Con thứ 3 trở lên", sinh_me20:"– Con của phụ nữ dưới 20 tuổi", mangthai_dang:"Số phụ nữ đang mang thai", vong_moi:"Số nữ đặt vòng tránh thai mới", vong_thay:"– Trong đó thay vòng", vong_thoi:"Số nữ thôi sử dụng vòng", tsnam:"Số nam mới triệt sản", tsnu:"Số nữ mới triệt sản", cay_moi:"Số nữ mới cấy thuốc tránh thai", cay_thay:"– Trong đó thay que cấy", cay_thoi:"Số nữ thôi sử dụng cấy" };

const slLuyke = y => S.solieu.filter(d => d.loai === "b01_luyke" && d.nam === y).sort((a,b) => a.to - b.to || a.from - b.from);
function slYears(){ const ys = new Set(S.solieu.map(d => d.nam).filter(Boolean)); if (!ys.size) ys.add(S.pY); return [...ys].sort((a,b) => b - a); }
/* Ghép số liệu: tháng có phiếu dùng phiếu; tháng chưa có phiếu dùng Biểu 01 hằng tháng đã báo cáo (theo địa bàn) */
function mergeImported(R, dbs, list, opts, dbKey){
  const yr = rangeYM(R), per = {}, used = new Set();
  if (!yr) { for (const db of dbs) per[db] = metricsOf([], opts).m; return { per, impMonths:[] }; }
  const imp = S.solieu.filter(d => d.loai === "b01_thang" && d.perDb);
  const inR = d => { const v = d.nam*12 + d.from; if (R.mode !== "ngay") return v >= yr[0] && v <= yr[1]; const t = d.nam*10000 + d.from*100 + 15; return t >= isoNum(R.fd) && t <= isoNum(R.td); };
  for (const db of dbs) {
    const ps = list.filter(p => dbKey(p) === db), m = metricsOf(ps, opts).m;
    const phMonths = new Set(ps.map(p => p.nam*12 + p.thang));
    let lastPh = 0; for (const p of ps) { const v = p.nam*12 + p.thang; if (v <= yr[1] && v > lastPh) lastPh = v; }
    let lastImp = 0, stock = null;
    for (const d of imp) {
      if (!inR(d)) continue; const v = d.nam*12 + d.from; if (phMonths.has(v)) continue;
      const vals = d.perDb[db]; if (!vals) continue; used.add(v);
      for (const k of Object.keys(vals)) { if (STOCK_KEYS.has(k)) { if (v > lastImp) { lastImp = v; stock = vals[k]; } } else if (k in m) m[k] += vals[k] || 0; }
    }
    if (lastImp > lastPh && stock != null) m.mangthai_dang = stock;
    per[db] = m;
  }
  return { per, impMonths: [...used].sort((a,b) => a - b) };
}
const sumPer = (per, dbs) => { const t = Object.fromEntries(METRICS.map(([k]) => [k, 0])); for (const db of dbs) for (const k in t) t[k] += (per[db] && per[db][k]) || 0; return t; };
const ymText = arr => { if (!arr.length) return ""; const f = v => `${pad2(((v-1)%12)+1)}/${Math.floor((v-1)/12)}`; return arr.length === 1 ? `tháng ${f(arr[0])}` : `tháng ${f(arr[0])}–${f(arr[arr.length-1])}`; };
function officialFor(rep){

}
function slChecks(y){

  for (const d of slMonthly(y)) if (d.perDb) {

  }

      const cum = STOCK_KEYS.has(k) ? mon[d.to].toanXa[k] : Array.from({length:d.to}, (_,i) => mon[i+1].toanXa[k] || 0).reduce((a,b) => a + b, 0);

async function slImportFiles(files){
  if (!files.length) return;
  const el = $("#slimp"); if (el) el.innerHTML = `<div class="status"><span class="spin"></span>Đang đọc ${files.length} tệp…</div>`;
  try {
    const XLSX = await loadLib("XLSX");
    const found = [];
    for (const f of files) {
      let wb; try { wb = XLSX.read(await f.arrayBuffer(), { type:"array" }); } catch(e){ found.push({ label:f.name, src:"Không mở được tệp", state:"bad" }); continue; }
      for (const sn of wb.SheetNames) {
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header:1, raw:true, defval:null });
        const d = parseBieu01Rows(rows) || parseChiTieuRows(rows);
        if (!d) { if (rows.length > 5) found.push({ label:`${f.name} · ${sn}`, src:"Không phải mẫu Biểu 01-DSX hay bảng chỉ tiêu", state:"bad" }); continue; }

      }
    }
    // trùng trong cùng lần nhập: giữ bản sau, ghi nhận bản trước
    const byId = {};
    for (const x of found) if (x.d) { if (byId[x.d.id]) { if (sameVals(byId[x.d.id].d, x.d)) { byId[x.d.id].d.nguon.push(...x.d.nguon); x.state = "dupe"; continue; } x.d.banCu = [{ nguon: byId[x.d.id].d.nguon[0], toanXa: byId[x.d.id].d.toanXa }]; byId[x.d.id].state = "dupe"; } byId[x.d.id] = x; }

}

function svgBars(data, opt = {}){

  const bw = iw / data.length, w = Math.min(34, bw * 0.62), yv = v => T + ih - (v / top) * ih;

  const lastI = data.map(d => d.v != null).lastIndexOf(true);

    g += `<rect x="${L + bw * i}" y="${T}" width="${bw}" height="${ih}" fill="transparent" data-tip="${esc(d.tip || (d.l + ": " + d.v))}"/>`;
    if (i === lastI) g += `<text class="lbl" x="${cx}" y="${y0 - 6}" text-anchor="middle">${d.v}</text>`;
  });

      const rep = S.reports.find(r => r.id === j.repId);
      if (!rep) { j.state = "error"; j.msg = "Kỳ báo cáo không còn."; continue; }
      j.state = "work"; j.msg = "Đang đọc tệp…"; refreshJobs();

}

    return { wb, text: wb.SheetNames.map(n => `--- Trang tính: ${n} ---\n` + XLSX.utils.sheet_to_csv(wb.Sheets[n], { FS:" | ", blankrows:false })).join("\n").slice(0, 120000), images:[] };
  }
  if (name.endsWith(".docx")) {
    const mammoth = await loadLib("mammoth");
    const res = await mammoth.convertToHtml({ arrayBuffer: await file.arrayBuffer() });
    const doc = new DOMParser().parseFromString(res.value, "text/html");
    const lines = [];
    const walk = el => {
      for (const n of el.children) {
        if (n.tagName === "TABLE") { for (const tr of n.querySelectorAll(":scope > tbody > tr, :scope > tr")) lines.push(Array.from(tr.children).map(td => td.querySelector("table") ? "" : td.textContent.trim().replace(/\s+/g," ")).join(" | ")); for (const inner of n.querySelectorAll("td table")) walk({ children:[inner] }); }
        else if (/^(P|H\d|LI)$/.test(n.tagName)) { const t = n.textContent.trim(); if (t) lines.push(t); }
        else walk(n);
      }
    };
    walk(doc.body);
    const images = [];
    for (const img of doc.querySelectorAll("img")) {
      const m = /^data:(image\/(png|jpeg|gif|webp));base64,(.+)$/.exec(img.getAttribute("src")||"");
      if (m && images.length < 8) { const bin = atob(m[3]); const u = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i); images.push(new Blob([u], {type:m[1]})); }
    }
    return { text: lines.join("\n").slice(0, 120000), images };
  }
  if (name.endsWith(".doc")) {
    try { return { text: readDocBinary(await file.arrayBuffer()).slice(0, 120000), images:[] }; }
    catch(e){ throw new Error((e && e.message) || "Không đọc được tệp .doc. Hãy mở bằng Word và lưu lại dạng .docx."); }
  }
  if (isImg(file)) return { text:"", images:[file] };
  if (name.endsWith(".pdf")) throw new Error("Chưa hỗ trợ PDF. Hãy chụp ảnh trang hoặc dùng bản Word/Excel.");
  throw new Error("Định dạng tệp chưa hỗ trợ.");
}
function readStandardSheet(wb, tpl){
  const XLSX = window.XLSX;
  for (const n of wb.SheetNames) {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[n], { header:1, raw:true, defval:"" });
    if (!rows.length || !String(rows[0][0]).startsWith("#TPL:")) continue;
    const tplIdInFile = String(rows[0][0]).slice(5).trim();
    const hi = rows.findIndex(r => String(r[0]).trim() === "#");
    if (hi < 0) continue;
    const colIds = rows[hi].map(x => String(x).trim());
    const rowSet = new Set(tpl.rows.filter(r => !r.formula && !r.head).map(r => r.id));
    const colSet = new Set(tpl.cols.filter(c => !c.formula).map(c => c.id));
    const values = [];
    for (let i = hi+1; i < rows.length; i++) {
      const rid = String(rows[i][0]).trim(); if (!rowSet.has(rid)) continue;
      for (let j = 1; j < colIds.length; j++) {
        if (!colSet.has(colIds[j])) continue;
        const v = parseNum(rows[i][j]); if (v == null) continue;
        values.push({ r:rid, c:colIds[j], v, src:"Ô chuẩn của biểu Excel trống" });
      }
    }
    let donVi = ""; const r2 = rows[1] || []; if (String(r2[0]).toLowerCase().startsWith("đơn vị")) donVi = String(r2[1]||"").trim();
    return { values, donVi, tomTat:"", exact:true, mismatch: tplIdInFile !== tpl.id };
  }
  return null;
}

  }

  const rs = new Set(rows.map(r => r.id)), cs = new Set(cols.map(c => c.id)), seen = new Set();
  j.values = result.values.map(x => ({ r:String(x.r||"").toLowerCase(), c:String(x.c||"").toLowerCase(), v: parseNum(x.v), src:String(x.src||"").slice(0,160) }))

async function saveFile(filename, data){
  if (!cap.downloads) { toast("Chế độ xem này chưa cho tải tệp. Hãy mở trang trong ứng dụng Claude hoặc claude.ai.", true); return; }
  try { await cap.downloads.save({ filename, data }); toast("Đã tải " + filename); }
  catch(e){ if (e && e.code === "declined") return; toast(e && e.code === "rate_limited" ? "Đang có hộp thoại tải tệp mở. Hoàn tất hộp thoại đó trước." : "Không tải được tệp (" + (e && e.code || "lỗi") + ").", true); }
}
const safeName = s => String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D").replace(/[\\/:*?"<>|]+/g,"-").replace(/\s+/g," ").trim().slice(0,120);
function unitName(rep){ const s = S.settings, base = s.donViBieu || [s.coQuan, s.chuQuan].filter(Boolean).join(" - "); return rep && rep.scope ? `${base} (địa bàn ${rep.scope})` : base; }
function bieuPeriodText(rep){
  if (rep.period.type === "ngay") return rangeLabel(repRange(rep)).toUpperCase();
  const [a, b] = periodRange(rep.period), y = rep.period.year;
  if (/01-DSX/i.test(rep.tpl.code)) return `TỪ THÁNG ${pad2(a)} ĐẾN THÁNG ${pad2(b)} NĂM ${y}`;
  return periodLabel(rep.period).toUpperCase();
}
const roundCell = (r, c, v) => { if (v == null) return null; const d = cellDec(r, c, !isInputCell(r,c)); return d == null ? v : Number(v.toFixed(d)); };

/* ===================== Xuất Excel ===================== */
async function exportXlsxForm(rep){
  const tpl = rep.tpl, xm = tpl.xmap || {};
  try {
    const ExcelJS = await loadLib("ExcelJS");
    const bin = atob(tpl.xlsx), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    const wb = new ExcelJS.Workbook(); await wb.xlsx.load(u.buffer);
    const ws = wb.getWorksheet(xm.sheet) || wb.worksheets[0];
    const {V} = compute(tpl, rep), ac = autoColId(tpl), s = S.settings, d = ndDate(rep.date || todayISO());
    for (const r of tpl.rows) {
      if (!r.xr || r.head) continue;
      const c = tpl.cols.find(x => x.id === ac) || tpl.cols[0];
      ws.getCell(xm.col + r.xr).value = roundCell(r, c, V[r.id+"|"+c.id]);
      if (xm.noteCol) ws.getCell(xm.noteCol + r.xr).value = (rep.ghiChu||{})[r.id] || null;
    }
    if (xm.unit) ws.getCell(xm.unit).value = "Đơn vị báo cáo: " + (unitName(rep) || "…");
    if (xm.period) ws.getCell(xm.period).value = bieuPeriodText(rep);
    if (xm.date) ws.getCell(xm.date).value = `${s.diaDanh || "……"}, ngày ${d.d} tháng ${d.m} năm ${d.y}`;
    if (xm.sigRow) {
      const put = (addr, text, like) => { const cell = ws.getCell(addr); cell.value = text || null; const ref = ws.getCell(like); cell.font = Object.assign({}, ref.font || {}, { bold:true }); cell.alignment = { horizontal:"center" }; };
      put("B" + (xm.sigRow + 4), s.nguoiLap, "B" + xm.sigRow);
      try { ws.mergeCells(`C${xm.sigRow+4}:E${xm.sigRow+4}`); } catch(e){}
      put("C" + (xm.sigRow + 4), s.nguoiKy, "C" + xm.sigRow);
    }
    const buf = await wb.xlsx.writeBuffer();
    await saveFile(safeName(`${tpl.code} ${periodLabel(rep.period)}`) + ".xlsx", new Uint8Array(buf));
  } catch(e){ toast("Không tạo được tệp Excel: " + (e && e.message || e), true); }
}
async function exportXlsxFilled(rep){
  if (rep.tpl.xlsx) return exportXlsxForm(rep);

  const aoa = [[(unitName(rep)||"TÊN CƠ QUAN").toUpperCase()], [tpl.code], [tpl.title.toUpperCase()], [periodLabel(rep.period).replace(/^./, x => x.toUpperCase())], [],
    ["STT","Chỉ tiêu","ĐVT", ...tpl.cols.map(c => c.name), ...(tpl.noteCol?["Ghi chú"]:[])], ["A","B","C", ...tpl.cols.map((c,i) => String(i+1))]];
  for (const r of tpl.rows) aoa.push([r.stt, r.name, r.unit, ...tpl.cols.map(c => r.head ? "" : roundCell(r, c, V[r.id+"|"+c.id]) ?? ""), ...(tpl.noteCol?[(rep.ghiChu||{})[r.id]||""]:[])]);
  const ws = XLSX.utils.aoa_to_sheet(aoa);

}

function nextId(list, p){ let n = 0; for (const x of list) { const m = new RegExp("^"+p+"(\\d+)$").exec(x.id); if (m) n = Math.max(n, +m[1]); } return p + (n+1); }
function readTplForm(){
  const t = tplDraft;
  t.code = $("#te-code").value.trim(); t.title = $("#te-title").value.trim(); t.text = $("#te-text").value; t.noteCol = $("#te-note").checked;
  for (const el of $$("[data-ed]")) {
    const arr = el.dataset.ed === "row" ? t.rows : t.cols, o = arr[+el.dataset.i], f = el.dataset.f;
    if (!o) continue;
    if (f === "bold" || f === "head") { if (el.checked) o[f] = true; else delete o[f]; }
    else if (f === "dec") { const v = el.value.trim(); if (v === "") delete o.dec; else o.dec = Math.max(0, Math.min(4, parseInt(v,10)||0)); }
    else { o[f] = el.value.trim(); if ((f === "formula" || f === "auto") && !o[f]) delete o[f]; }
  }
}
function validateFormulas(t){
  const rIds = new Set(t.rows.map(r => r.id)), cIds = new Set(t.cols.map(c => c.id)), errs = [];
  const chk = (f, set, who) => { const refs = (f.match(/\b[rc]\d+\b/gi)||[]).map(x => x.toLowerCase()); for (const x of refs) if (!set.has(x)) errs.push(`${who}: mã "${x}" không tồn tại`); if (!/^[\src0-9+\-*/().:SUMsum]*$/.test(f)) errs.push(`${who}: có ký tự không hợp lệ`); };
  t.rows.forEach(r => r.formula && chk(r.formula, rIds, `Chỉ tiêu "${r.name}"`));
  t.cols.forEach(c => c.formula && chk(c.formula, cIds, `Cột "${c.name}"`));
  return errs;
}

  if (!t.rows.length || !t.cols.length) return toast("Biểu cần ít nhất một chỉ tiêu và một cột.", true);
  if (t.rows.some(r => !r.name)) return toast("Có chỉ tiêu chưa có tên.", true);
  const errs = validateFormulas(t); if (errs.length) return toast(errs[0], true);
  t.updatedAt = Date.now();
  if (!t.id) { t.id = uid("t"); t.createdAt = Date.now(); S.templates.push(t); }
  else { const i = S.templates.findIndex(x => x.id === t.id); S.templates[i] = t; }
  await store.put("templates", t);
  toast("Đã lưu biểu mẫu " + t.code);
  tplDraft = null; go("templates");
}
function tplFromFile(file){
  const st = $("#tplfile-status");
  const show = (html) => { if (st) st.innerHTML = `<div class="panel">${html}</div>`; };
  (async () => {
    try {
      show(`<span class="spin"></span>Đang đọc biểu mẫu từ "${esc(file.name)}"…`);
      const got = await fileToText(file);
      let images = got.images; if (images.length && !cap.images) { if (!got.text) throw {code:"images_unavailable"}; images = []; }
      const prompt = `Đọc biểu mẫu báo cáo trong tài liệu sau (lĩnh vực dân số, Việt Nam) và mô tả cấu trúc của nó dưới dạng JSON:
{"code":"Biểu số …","title":"…","rows":[{"stt":"1.","name":"…","unit":"Người","formula":"","bold":false,"head":false,"auto":""}],"cols":[{"name":"…","formula":""}]}
- rows: tất cả chỉ tiêu theo đúng thứ tự từ trên xuống, giữ nguyên STT và tên. Hàng thứ i (đếm từ 1) có mã r{i}. Dòng nhóm (I, II… hoặc "Trong tổng số:") đặt head: true.
- cols: chỉ các cột số liệu (không gồm STT, tên chỉ tiêu, đơn vị tính, ghi chú). Cột thứ j có mã c{j}.
- formula: chỉ điền khi rõ ràng là tổng/tỷ lệ của hàng/cột khác, dùng mã: "SUM(r2:r5)", "r3+r4", "c3/c1*100". Không chắc thì để rỗng.
- auto: nếu chỉ tiêu đếm được từ phiếu thu tin của cộng tác viên dân số thì ghi một mã trong danh sách: ${METRICS.map(([k,l]) => `${k} (${l})`).join("; ")}. Không khớp thì để rỗng.
Chỉ trả về JSON.
TÀI LIỆU: ${file.name}
${got.text ? "<<<\n" + got.text.slice(0, 60000) + "\n>>>" : "(Biểu mẫu là ảnh đính kèm)"}`;
      show(`<span class="spin"></span>Claude đang dựng cấu trúc biểu từ "${esc(file.name)}"…`);
      const res = await cap.sample.json(prompt, { images: images.length ? images.slice(0, cap.images?.maxCount || 4) : undefined, modelTier: S.settings.aiTier || "default" });
      const okAuto = new Set(METRICS.map(m => m[0]));
      const rows = (res.rows||[]).map((r,i) => ({ id:"r"+(i+1), stt:String(r.stt??""), name:String(r.name||"").trim(), unit:String(r.unit||""), ...(r.formula?{formula:String(r.formula).toLowerCase().replace(/sum/g,"SUM")}:{}), ...(r.bold?{bold:true}:{}), ...(r.head?{head:true}:{}), ...(okAuto.has(r.auto)?{auto:r.auto}:{}) })).filter(r => r.name);
      const cols = (res.cols||[]).map((c,i) => ({ id:"c"+(i+1), name:String(c.name||"").trim() || ("Cột "+(i+1)), ...(c.formula?{formula:String(c.formula).toLowerCase().replace(/sum/g,"SUM")}:{}) }));
      if (!rows.length || !cols.length) throw new Error("Không nhận ra được chỉ tiêu và cột trong tệp này.");
      tplDraft = { id:null, code:String(res.code||"Biểu mới"), title:String(res.title||file.name.replace(/\.[^.]+$/,"")), rows, cols, text:"", noteCol:true };
      S.tplId = null; go("tpledit");
      toast(`Đã dựng ${rows.length} chỉ tiêu, ${cols.length} cột. Kiểm tra lại rồi bấm Lưu biểu mẫu.`);
    } catch(e){ show(`<span class="status err">${esc(errText(e))}</span>`); }
  })();
}

    case "tab": S.tab = b.dataset.v; render(); break;

    case "pe-sec": peReadHeader(); peState.sec = b.dataset.v; peRender(); break;
    case "pe-add": { const o = {}; SEC[peState.sec].cols.forEach(c => o[c.k] = c.t === "n" ? null : ""); peState.d.sections[peState.sec].push(o); peRender(); break; }
    case "pe-rm": peState.d.sections[peState.sec].splice(+b.dataset.i, 1); peRender(); break;
    case "pe-zoom": b.classList.toggle("big"); b.style.width = b.classList.contains("big") ? "200%" : ""; break;
    case "newrep": newReportModal(); break;
    case "delrep": if (await confirmBox(`Xóa kỳ "${rep.title}" cùng số liệu nhập tay? Phiếu CTV không bị xóa.`, "Xóa kỳ", true)) { S.reports = S.reports.filter(r => r !== rep); await store.del("reports", rep.id); go("reports"); toast("Đã xóa kỳ báo cáo."); } break;
    case "clearvals": if (await confirmBox("Xóa toàn bộ số nhập tay và các nguồn cộng dồn của kỳ này? Số đếm từ phiếu CTV vẫn giữ.", "Xóa", true)) { rep.base = {}; rep.parts = []; saveReportSoon(rep); render(); } break;
    case "synctpl": { const live = S.templates.find(t => t.id === rep.tplId); rep.tpl = clone(live); delete rep.tpl.xlsx; repTpl(rep); saveReportSoon(rep); render(); toast("Đã cập nhật cấu trúc biểu."); break; }
    case "dupfrom": copyFromModal(rep); break;
    case "review": { const j = S.jobs.find(x => x.id === b.dataset.id); if (j) openReview(j); break; }
    case "dropjob": S.jobs = S.jobs.filter(x => x.id !== b.dataset.id); refreshJobs(); break;
    case "retryjob": { const j = S.jobs.find(x => x.id === b.dataset.id); if (j) { j.state = "wait"; j.msg = "Đang chờ…"; refreshJobs(); runQueue(); } break; }
    case "viewpart": viewPartModal(rep, rep.parts.find(p => p.id === b.dataset.id)); break;
    case "delpart": { const p = rep.parts.find(x => x.id === b.dataset.id); if (await confirmBox(`Bỏ nguồn "${p.name}"?`, "Bỏ nguồn", true)) { rep.parts = rep.parts.filter(x => x !== p); saveReportSoon(rep); render(); } break; }
    case "delnote": rep.notes = (rep.notes||[]).filter(n => n.id !== b.dataset.id); saveReportSoon(rep); render(); break;
    case "undotext": if (rep.prevText != null) { rep.text = rep.prevText; delete rep.prevText; saveReportSoon(rep); $("#tabbody").innerHTML = tabText(rep); bindText(rep); toast("Đã khôi phục nội dung trước khi cập nhật."); } break;
    case "draft": draftWithClaude(rep); break;
    case "stopdraft": draftCtl?.abort(); break;
    case "insph": insertPlaceholder(rep); break;
    case "docx": exportDocx(rep); break;
    case "xlsx-form": exportXlsxForm(repTpl(rep)); break;
    case "xlsx-filled": exportXlsxFilled(repTpl(rep)).catch(err => toast(err.message, true)); break;
    case "xlsx-blank": exportXlsxBlank(rep).catch(err => toast(err.message, true)); break;
    case "newtpl": tplDraft = { id:null, code:"", title:"", rows:[{id:"r1",stt:"1.",name:"",unit:"Người"}], cols:[{id:"c1",name:"Toàn xã"}], text:"", noteCol:true }; go("tpledit", { tplId:null }); break;
    case "edittpl": { const src = S.templates.find(t => t.id === b.dataset.id); tplDraft = clone(src); go("tpledit", { tplId:b.dataset.id }); break; }
    case "tplfromfile": { const fi = $("#tpl-file"); fi.onchange = () => { if (fi.files[0]) tplFromFile(fi.files[0]); fi.value = ""; }; fi.click(); break; }
    case "savetpl": saveTpl(); break;
    case "deltpl": { const n = S.reports.filter(r => r.tplId === tplDraft.id).length;
      if (await confirmBox(`Xóa biểu mẫu "${tplDraft.code}"?` + (n ? ` ${n} kỳ báo cáo đang dùng vẫn giữ bản sao cấu trúc của mình.` : ""), "Xóa biểu mẫu", true)) { S.templates = S.templates.filter(t => t.id !== tplDraft.id); await store.del("templates", tplDraft.id); tplDraft = null; go("templates"); } break; }
    case "addrow": readTplForm(); tplDraft.rows.push({ id:nextId(tplDraft.rows,"r"), stt:"", name:"", unit:"" }); render(); break;
    case "addcol": readTplForm(); tplDraft.cols.push({ id:nextId(tplDraft.cols,"c"), name:"" }); render(); break;
    case "rmrow": readTplForm(); tplDraft.rows.splice(+b.dataset.i, 1); render(); break;
    case "rmcol": readTplForm(); tplDraft.cols.splice(+b.dataset.i, 1); render(); break;
    case "mvrow": case "mvcol": { readTplForm(); const arr = act==="mvrow" ? tplDraft.rows : tplDraft.cols, i = +b.dataset.i, k = i + (+b.dataset.d); if (k>=0 && k<arr.length) { [arr[i],arr[k]] = [arr[k],arr[i]]; render(); } break; }
    case "sa-export": { const all = await window.__IDB.all(); const d = new Date(); await saveFile(`Sao luu tong hop dan so ${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}.json`, JSON.stringify({ app:"tong-hop-dan-so", version:1, exportedAt:d.toISOString(), kv:all })); break; }
    case "sa-savekey": try { const v = id => $(id).value.trim(); v("#sa-key") ? localStorage.setItem("ths_api_key", v("#sa-key")) : localStorage.removeItem("ths_api_key"); v("#sa-m1") ? localStorage.setItem("ths_model", v("#sa-m1")) : localStorage.removeItem("ths_model"); v("#sa-m2") ? localStorage.setItem("ths_model_complex", v("#sa-m2")) : localStorage.removeItem("ths_model_complex"); } catch(e){ toast("Trình duyệt không cho lưu cài đặt.", true); break; } location.reload(); break;
    case "sa-clearkey": try { localStorage.removeItem("ths_api_key"); } catch(e){} location.reload(); break;
    case "savesettings": readSettingsForm(); await store.putSettings(); setNav(); toast("Đã lưu thông tin cơ quan."); break;
    case "db-add": readSettingsForm(); S.settings.diaBan = [...(S.settings.diaBan||[]), { ten:"", thon:"" }]; render(); $$("[data-db-name]").pop()?.focus(); break;
    case "db-rm": { readSettingsForm(); const i = +b.dataset.i, d = (S.settings.diaBan||[])[i]; if (d && (d.ten || d.thon) && !(await confirmBox(`Xóa địa bàn "${d.ten || "chưa đặt tên"}" khỏi danh sách? Phiếu đã lưu không bị xóa.`, "Xóa", true))) break; S.settings.diaBan.splice(i, 1); render(); break; }
    case "dv-quick": { const q = quickList()[+b.dataset.i]; applyQuick(q, dvBaseYear()); await loadRange(dvR()); render(); break; }
    case "dv-preset": { const pr = (S.settings.presets||[])[+b.dataset.i]; if (pr) { applyPreset(pr, dvBaseYear()); await loadRange(dvR()); render(); } break; }
    case "dv-preset-rm": { const pr = (S.settings.presets||[])[+b.dataset.i]; if (pr && await confirmBox(`Xóa mốc "${pr.ten}"?`, "Xóa", true)) { S.settings.presets.splice(+b.dataset.i, 1); await store.putSettings(); render(); } break; }
    case "dv-save-preset": { const name = $("#dv-pname").value.trim(); if (!name) { toast("Nhập tên cho mốc thời gian.", true); $("#dv-pname").focus(); break; } const er = rangeCheck(dvR()); if (er) { toast(er, true); break; } const pr = presetFromCurrent(name); S.settings.presets = [...(S.settings.presets||[]).filter(x => x.ten !== name), pr]; await store.putSettings(); render(); toast(`Đã lưu mốc "${name}".`); break; }
    case "dv-all": { const M = dvModel(); S.dv.dbs = M.dbs.length === M.allDb.length ? [] : null; render(); break; }
    case "dv-xlsx": exportDiaBanXlsx(); break;
    case "sltab": S.slTab = b.dataset.v; render(); break;
    case "home-newrep": go("reports"); newReportModal(); break;
    case "home-check": S.slTab = "doichieu"; go("solieu"); break;
    case "slm": S.slM = +b.dataset.v; S.slTab = "thang"; render(); break;
    case "slsave": slSave(); break;
    case "slclear": slPending = []; render(); break;
    case "sldel": { const d = S.solieu.find(x => x.id === b.dataset.id); if (d && await confirmBox("Xóa bảng số liệu này khỏi trang? Tệp gốc của anh/chị không bị ảnh hưởng.", "Xóa", true)) { S.solieu = S.solieu.filter(x => x !== d); await store.del("solieu", d.id); render(); toast("Đã xóa."); } break; }
    case "useofficial": { const of = officialFor(rep), ac = autoColId(rep.tpl); if (!of) break; rep.base = rep.base || {}; let n = 0; for (const r of rep.tpl.rows) if (r.auto && of.toanXa[r.auto] != null) { rep.base[r.id + "|" + ac] = of.toanXa[r.auto]; n++; } saveReportSoon(rep); render(); toast(`Đã điền ${n} chỉ tiêu theo số đã báo cáo.`); break; }
    case "dv-docx": exportDiaBanDocx(); break;
  }
});
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches(".item[data-act]")) { e.preventDefault(); e.target.click(); }
  if (e.key === "Escape" && !$("#modal").hidden && !$("#modal").dataset.lock) closeModal();
});

/* ===================== Khởi động ===================== */
(async function init(){
  const [db, sample, downloads, usr] = await Promise.all([useCap("db"), useCap("sample"), useCap("downloads"), useCap("user")]);
  let canSee = !!db;
  if (usr) { try { canSee = canSee && ((await usr.isOwner()) || (await usr.canEdit())); } catch(e){} }
  cap.access = !db ? "nodb" : canSee ? "ok" : "noperm";
  cap.db = db; cap.sample = sample; cap.downloads = downloads;
  if (sample) { try { const l = await sample.limits(); cap.images = l && l.images || null; } catch(e){} }
  if (window.__STANDALONE) cap.access = "ok";
  $("#st-db").innerHTML = window.__STANDALONE ? `<span class="dot"></span>Dữ liệu lưu trong trình duyệt máy này` : cap.access === "ok" ? `<span class="dot"></span>Dữ liệu được lưu tự động` : cap.access === "noperm" ? `<span class="dot off"></span>Tài khoản này chưa có quyền xem số liệu` : `<span class="dot off"></span>Chưa kết nối dữ liệu – cần đăng nhập`;
  $("#st-ai").innerHTML = window.__STANDALONE && !sample ? `<span class="dot off"></span>Chưa kết nối Claude (nhập khóa API ở Thông tin cơ quan)` : sample ? `<span class="dot"></span>Trợ lý đọc tệp sẵn sàng${cap.images?"":" (không đọc ảnh)"}` : `<span class="dot off"></span>Trợ lý đọc tệp chưa sẵn sàng`;
  try { await store.loadAll(); await store.loadYear(S.pY); } catch(e){ toast("Không tải được dữ liệu đã lưu: " + (e && e.message || e.code || ""), true); }
  S.view = "home"; bindTips();
  S.loaded = true; render();
})();
</script>
